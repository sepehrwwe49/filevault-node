user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    use epoll;
    worker_connections  16384;
    multi_accept on;
}

################################################################################
#  LAYER 1 : raw TCP on :443  ->  SNI based split (Reality = raw passthrough)
################################################################################
stream {
    log_format basic '$remote_addr [$time_local] $ssl_preread_server_name -> $name';
    access_log off;
    error_log /var/log/nginx/stream_error.log error;

    include /etc/nginx/stream.d/*.conf;
}

################################################################################
#  LAYER 2 : TLS terminated web + XHTTP
################################################################################
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 512m;
    client_body_buffer_size 1m;
    types_hash_max_size 2048;

    # --- zero I/O for proxy traffic ---
    access_log off;
    error_log /var/log/nginx/error.log crit;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # real client ip from cloudflare
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/conf.d/*.conf;
}
