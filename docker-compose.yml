services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fv-nginx
    restart: always
    network_mode: host          # needs 127.0.0.1 access to Xray + panel
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
      - ./site:/var/www/site:ro
      - ./data:/var/www/data
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./nginx/acme:/var/www/acme
    depends_on:
      - php

  php:
    build: ./site
    container_name: fv-php
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      SITE_NAME: ${SITE_NAME:-FileVault}
    volumes:
      - ./site:/var/www/site:ro
      - ./data:/var/www/data

  certbot:
    build: ./cleaner/certbot
    container_name: fv-certbot
    restart: always
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
      LE_EMAIL: ${LE_EMAIL}
      SITE_DOMAINS: ${SITE_DOMAINS}
    volumes:
      - ./letsencrypt:/etc/letsencrypt

  cleaner:
    image: alpine:3.20
    container_name: fv-cleaner
    restart: always
    environment:
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ./data:/var/www/data
      - ./cleaner/cleanup.sh:/cleanup.sh:ro
    command: ["/bin/sh","-c","while true; do sh /cleanup.sh; sleep 3600; done"]
